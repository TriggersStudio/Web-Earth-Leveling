services:
  web:
    image: ghcr.io/triggersstudio/web-earth-leveling:latest
    container_name: web-earth-leveling
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3


