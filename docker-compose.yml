services:
  # Shared PostgreSQL database for Triggers ecosystem
  # This is the same database used by Triggers-Backend-Api
  db:
    image: postgres:16-alpine
    container_name: web-earth-leveling-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: triggers
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
